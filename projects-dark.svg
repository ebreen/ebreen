<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img">
  <defs><style>
      .display { font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 400; }
      .sans { font-family: 'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .rise { animation: rise .55s cubic-bezier(.16,1,.3,1); }
      .d1 { animation-delay: .06s; }
      .d2 { animation-delay: .12s; }
      .d3 { animation-delay: .18s; }
      .d4 { animation-delay: .24s; }
      .rule { transform-box: fill-box; transform-origin: left center; animation: drawx .7s cubic-bezier(.16,1,.3,1) .12s; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .rule { animation: none !important; }
      }
</style></defs>
  <rect x="0.5" y="0.5" width="839" height="379" rx="20" fill="#111111" stroke="#292929"/>
  <g class="rise">
    <text x="48" y="44" class="mono" font-size="11" fill="#98938a" letter-spacing="1.2">MADE</text>
    <text x="46" y="80" class="display" font-size="24" fill="#efece3">Things that survived the weekend</text>
  </g>
  <g class="rise d1">
    <text x="48" y="118" class="mono" font-size="12" fill="#d6b45f">01</text>
    <text x="88" y="118" class="sans" font-size="16" font-weight="600" fill="#efece3">PixelWitness</text>
    <text x="88" y="140" class="sans" font-size="14" fill="#98938a">Local Chrome extension that scores page images for AI generation. Nothing leaves the browser.</text>
  </g>
  <g class="rise d2">
    <text x="48" y="174" class="mono" font-size="12" fill="#d6b45f">02</text>
    <text x="88" y="174" class="sans" font-size="16" font-weight="600" fill="#efece3">Parrot for Windows</text>
    <text x="88" y="196" class="sans" font-size="14" fill="#98938a">Hold a key, speak, release. Private push-to-talk dictation with local NVIDIA inference.</text>
  </g>
  <g class="rise d3">
    <text x="48" y="230" class="mono" font-size="12" fill="#d6b45f">03</text>
    <text x="88" y="230" class="sans" font-size="16" font-weight="600" fill="#efece3">Shield AirPlay</text>
    <text x="88" y="252" class="sans" font-size="14" fill="#98938a">Free AirPlay receiver for NVIDIA Shield and Android TV. No ads, no subscriptions.</text>
  </g>
  <g class="rise d4">
    <text x="48" y="286" class="mono" font-size="12" fill="#d6b45f">04</text>
    <text x="88" y="286" class="sans" font-size="16" font-weight="600" fill="#efece3">CloudMount</text>
    <text x="88" y="308" class="sans" font-size="14" fill="#98938a">Backblaze B2 buckets as native Finder volumes via FSKit. No FUSE, no kexts.</text>
  </g>
  <g class="rise d4">
    <text x="48" y="356" class="mono" font-size="12" fill="#98938a">more on github.com/ebreen  ·  writeup at eirikbreen.com</text>
  </g>
</svg>
