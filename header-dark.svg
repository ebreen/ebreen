<svg xmlns="http://www.w3.org/2000/svg" width="840" height="164" viewBox="0 0 840 164" role="img">
  <defs>
    <clipPath id="ruleClip">
      <rect x="48" y="98" width="56" height="1.5" rx="1"/>
    </clipPath>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efece3" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#efece3" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#efece3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#efece3" stop-opacity="0"/>
    </linearGradient>
    <style>
      .display { font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 400; }
      .sans { font-family: 'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .rise { animation: rise .55s cubic-bezier(.16,1,.3,1); }
      .rule { transform-box: fill-box; transform-origin: left center; animation: drawx .7s cubic-bezier(.16,1,.3,1) .12s; }
      .shimmer { animation: shimmer 3.4s ease-in-out .8s infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes shimmer { from { transform: translateX(0); } to { transform: translateX(80px); } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .rule, .shimmer { animation: none !important; }
      }
</style></defs>
  <rect x="0.5" y="0.5" width="839" height="163" rx="20" fill="#111111" stroke="#292929"/>
  <g class="rise">
    <text x="46" y="82" class="display" font-size="40" fill="#efece3">Eirik Breen</text>
    <rect class="rule" x="48" y="98" width="56" height="1.5" rx="1" fill="#d6b45f"/>
    <g clip-path="url(#ruleClip)">
      <rect class="shimmer" x="8" y="97" width="36" height="3.5" fill="url(#flash)"/>
    </g>
    <text x="48" y="130" class="sans" font-size="16" font-weight="400" fill="#cbc6bb">Senior Systems Consultant, Oslo</text>
  </g>
</svg>
