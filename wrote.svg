<svg xmlns="http://www.w3.org/2000/svg" width="840" height="268" viewBox="0 0 840 268" role="img">
  <defs><style>
      .display { font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 400; }
      .sans { font-family: 'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .rise { animation: rise .55s cubic-bezier(.16,1,.3,1); }
      .d1 { animation-delay: .06s; }
      .d2 { animation-delay: .12s; }
      .d3 { animation-delay: .18s; }
      .rule { transform-box: fill-box; transform-origin: left center; animation: drawx .7s cubic-bezier(.16,1,.3,1) .12s; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .rule { animation: none !important; }
      }
</style></defs>
  <rect x="0.5" y="0.5" width="839" height="267" rx="20" fill="#f3efe4" stroke="#d8d0bc"/>
  <g class="rise">
    <text x="48" y="44" class="mono" font-size="11" fill="#6b665c" letter-spacing="1.2">WROTE</text>
    <text x="46" y="80" class="display" font-size="24" fill="#1c1a14">Latest notes</text>
  </g>
  <g class="rise d1">
    <circle cx="54" cy="114" r="2.5" fill="#7a6118"/>
    <text x="72" y="118" class="sans" font-size="16" font-weight="600" fill="#1c1a14">Why CloudMount Uses FSKit Instead of FUSE</text>
    <text x="792" y="118" class="mono" font-size="12" fill="#6b665c" text-anchor="end">21 Jun 2026</text>
  </g>
  <g class="rise d2">
    <circle cx="54" cy="150" r="2.5" fill="#7a6118"/>
    <text x="72" y="154" class="sans" font-size="16" font-weight="600" fill="#1c1a14">My Monitoring Stack Got Smaller and Better</text>
    <text x="792" y="154" class="mono" font-size="12" fill="#6b665c" text-anchor="end">24 May 2026</text>
  </g>
  <g class="rise d3">
    <circle cx="54" cy="186" r="2.5" fill="#7a6118"/>
    <text x="72" y="190" class="sans" font-size="16" font-weight="600" fill="#1c1a14">Giving an AI Agent a Real Coding Bounty</text>
    <text x="792" y="190" class="mono" font-size="12" fill="#6b665c" text-anchor="end">1 May 2026</text>
  </g>
  <g class="rise d3">
    <text x="48" y="236" class="mono" font-size="12" fill="#6b665c">all notes at eirikbreen.com/blog</text>
  </g>
</svg>
