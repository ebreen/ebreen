name: Update wrote card

on:
  schedule:
    - cron: "15 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-wrote.mjs"
      - ".github/workflows/update-wrote.yml"

permissions:
  contents: write

jobs:
  update-wrote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ebreen/ebreen
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout ebreen/devblog
        uses: actions/checkout@v4
        with:
          repository: ebreen/devblog
          path: .devblog

      - name: Generate wrote cards
        env:
          DEVBLOG_DIR: .devblog
        run: node scripts/generate-wrote.mjs

      - name: Commit if the cards changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrote.svg wrote-dark.svg
          if git diff --cached --quiet; then
            echo "wrote cards unchanged"
          else
            git commit -m "Refresh latest notes on profile"
            git push
          fi
