<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img">
  <defs><style>
      .display { font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 400; }
      .sans { font-family: 'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .rise { animation: rise .55s cubic-bezier(.16,1,.3,1); }
      .d1 { animation-delay: .06s; }
      .d2 { animation-delay: .12s; }
      .d3 { animation-delay: .18s; }
      .rule { transform-box: fill-box; transform-origin: left center; animation: drawx .7s cubic-bezier(.16,1,.3,1) .12s; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .rule { animation: none !important; }
      }
</style></defs>
  <rect x="0.5" y="0.5" width="839" height="319" rx="20" fill="#f3efe4" stroke="#d8d0bc"/>
  <g class="rise">
    <text x="48" y="44" class="mono" font-size="11" fill="#6b665c" letter-spacing="1.2">MADE</text>
    <text x="46" y="80" class="display" font-size="24" fill="#1c1a14">Things that survived the weekend</text>
  </g>
  <g class="rise d1">
    <text x="48" y="118" class="sans" font-size="16" font-weight="600" fill="#1c1a14">PixelWitness</text>
    <text x="48" y="140" class="sans" font-size="14" fill="#6b665c">Local Chrome extension that scores page images for AI generation. Nothing leaves the browser.</text>
  </g>
  <rect x="48" y="156" width="744" height="1" fill="#d8d0bc" opacity="1"/>
  <g class="rise d2">
    <text x="48" y="170" class="sans" font-size="16" font-weight="600" fill="#1c1a14">Parrot for Windows</text>
    <text x="48" y="192" class="sans" font-size="14" fill="#6b665c">Hold a key, speak, release. Private push-to-talk dictation with local NVIDIA inference.</text>
  </g>
  <rect x="48" y="208" width="744" height="1" fill="#d8d0bc" opacity="1"/>
  <g class="rise d3">
    <text x="48" y="222" class="sans" font-size="16" font-weight="600" fill="#1c1a14">Shield AirPlay</text>
    <text x="48" y="244" class="sans" font-size="14" fill="#6b665c">Free AirPlay receiver for NVIDIA Shield and Android TV. No ads, no subscriptions.</text>
  </g>
  <g class="rise d3">
    <text x="48" y="288" class="mono" font-size="12" fill="#6b665c">more on github.com/ebreen  ·  writeup at eirikbreen.com</text>
  </g>
</svg>
